name: Build JTVTV IPA

# Builds the JTV app (tvOS) as an UNSIGNED .ipa, exactly like the
# JoeTV workflow in joetv-tvos: the owner signs IPAs himself
# (Signulous), so the workflow builds with CODE_SIGNING_ALLOWED=NO
# and zips the .app into a Payload/ layout. Dispatch-only, single
# target, so one dispatch spends exactly one macOS job.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-jtvtv:
    runs-on: macos-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Compute unique artifact name
        id: names
        run: |
          DATE="$(date +%Y%m%d)"
          NAME="JTVTV-ipa-run${{ github.run_number }}-${DATE}"
          echo "name=${NAME}" >> "$GITHUB_OUTPUT"
          echo "Artifact / IPA name: ${NAME}"

      - name: Select latest stable Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.x'

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Inject bundled secrets
        env:
          RD_TOKEN: ${{ secrets.RD_TOKEN }}
          TORBOX_TOKEN: ${{ secrets.TORBOX_TOKEN }}
          PREMIUMIZE_TOKEN: ${{ secrets.PREMIUMIZE_TOKEN }}
          MF_URL: ${{ secrets.MF_URL }}
          APP_LOCK_PIN: ${{ secrets.APP_LOCK_PIN }}
        run: |
          set -euo pipefail
          PIN_CLEAN="$(printf %s "$APP_LOCK_PIN" | tr -d '[:space:]')"
          trim() { local v="$1"; v="${v#"${v%%[![:space:]]*}"}"; v="${v%"${v##*[![:space:]]}"}"; printf %s "$v"; }
          RD_TOKEN="$(trim "$RD_TOKEN")"
          TORBOX_TOKEN="$(trim "$TORBOX_TOKEN")"
          PREMIUMIZE_TOKEN="$(trim "$PREMIUMIZE_TOKEN")"
          MF_URL="$(trim "$MF_URL")"
          if [ -n "$RD_TOKEN" ]; then echo "RD_TOKEN: present"; else echo "RD_TOKEN: MISSING"; fi
          if [ -n "$TORBOX_TOKEN" ]; then echo "TORBOX_TOKEN: present"; else echo "TORBOX_TOKEN: MISSING"; fi
          if [ -n "$PREMIUMIZE_TOKEN" ]; then echo "PREMIUMIZE_TOKEN: present"; else echo "PREMIUMIZE_TOKEN: MISSING"; fi
          if [ -n "$MF_URL" ]; then echo "MF_URL: present"; else echo "MF_URL: MISSING"; fi
          if [ -n "$PIN_CLEAN" ]; then echo "APP_LOCK_PIN: present"; else echo "APP_LOCK_PIN: MISSING"; fi
          RD_B64="$(printf %s "$RD_TOKEN" | base64 | tr -d '\n')"
          TORBOX_B64="$(printf %s "$TORBOX_TOKEN" | base64 | tr -d '\n')"
          PREMIUMIZE_B64="$(printf %s "$PREMIUMIZE_TOKEN" | base64 | tr -d '\n')"
          MF_B64="$(printf %s "$MF_URL" | base64 | tr -d '\n')"
          if [ -n "$PIN_CLEAN" ]; then
            PIN_HASH="$(printf %s "$PIN_CLEAN" | shasum -a 256 | awk '{print $1}')"
          else
            PIN_HASH=""
          fi
          if [ -n "$PIN_HASH" ]; then
            PIN_CONFIGURED="true"
          else
            PIN_CONFIGURED="false"
          fi
          {
            printf 'import Foundation\n'
            printf '\n'
            printf '/// GENERATED by .github/workflows/build-jtv-tvos.yml from repo\n'
            printf '/// secrets — do not edit, and never commit a generated copy.\n'
            printf '/// The committed copy of this file is empty ("nothing\n'
            printf '/// configured"). Token values are stored base64-encoded and\n'
            printf '/// decoded at runtime (Phase 1 plan §3.2), so no character a\n'
            printf '/// secret can contain can break the Swift literal. The app-lock\n'
            printf '/// PIN itself is never embedded — only its SHA-256 hex.\n'
            printf 'public enum BundledSecrets {\n'
            printf '    private static let rdTokenB64 = "%s"\n' "$RD_B64"
            printf '    private static let torboxTokenB64 = "%s"\n' "$TORBOX_B64"
            printf '    private static let premiumizeTokenB64 = "%s"\n' "$PREMIUMIZE_B64"
            printf '    private static let mfURLB64 = "%s"\n' "$MF_B64"
            printf '\n'
            printf '    public static let rdToken = decode(rdTokenB64)\n'
            printf '    public static let torboxToken = decode(torboxTokenB64)\n'
            printf '    public static let premiumizeToken = decode(premiumizeTokenB64)\n'
            printf '    public static let mfURL = decode(mfURLB64)\n'
            printf '\n'
            printf '    /// SHA-256 hex of the APP_LOCK_PIN build secret; "" when unset.\n'
            printf '    public static let pinHash = "%s"\n' "$PIN_HASH"
            printf '    /// True when an APP_LOCK_PIN secret was present at build time.\n'
            printf '    public static let pinConfigured = %s\n' "$PIN_CONFIGURED"
            printf '\n'
            printf '    private static func decode(_ base64: String) -> String {\n'
            printf '        guard let data = Data(base64Encoded: base64),\n'
            printf '              let value = String(data: data, encoding: .utf8) else {\n'
            printf '            return ""\n'
            printf '        }\n'
            printf '        return value\n'
            printf '    }\n'
            printf '}\n'
          } > JTV/BundledSecrets.swift
          {
            printf 'import Foundation\n'
            printf '\n'
            printf '/// GENERATED by .github/workflows/build-jtv-tvos.yml from repo\n'
            printf '/// secrets — do not edit, and never commit a generated copy.\n'
            printf '/// The committed copy of this file is empty ("nothing\n'
            printf '/// configured"). Token values are stored base64-encoded and\n'
            printf '/// decoded at runtime, with the same mechanism as\n'
            printf '/// BundledSecrets.swift, so no character a secret can contain can break the Swift literal. DebridTokens falls back to\n'
            printf '/// these values when no Settings-typed token is stored.\n'
            printf 'enum DebridSecrets {\n'
            printf '    private static let rdTokenB64 = "%s"\n' "$RD_B64"
            printf '    private static let torboxTokenB64 = "%s"\n' "$TORBOX_B64"
            printf '    private static let premiumizeTokenB64 = "%s"\n' "$PREMIUMIZE_B64"
            printf '\n'
            printf '    static let rdToken = decode(rdTokenB64)\n'
            printf '    static let torboxToken = decode(torboxTokenB64)\n'
            printf '    static let premiumizeToken = decode(premiumizeTokenB64)\n'
            printf '\n'
            printf '    private static func decode(_ base64: String) -> String {\n'
            printf '        guard let data = Data(base64Encoded: base64),\n'
            printf '              let value = String(data: data, encoding: .utf8) else {\n'
            printf '            return ""\n'
            printf '        }\n'
            printf '        return value\n'
            printf '    }\n'
            printf '}\n'
          } > JTV/DebridSecrets.swift

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build (unsigned)
        run: |
          set -euo pipefail
          xcodebuild \
            -project JTVTV.xcodeproj \
            -scheme JTVTV \
            -configuration Release \
            -destination 'generic/platform=tvOS' \
            CONFIGURATION_BUILD_DIR="$PWD/build/app-jtvtv" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM="" \

          test -d "$PWD/build/app-jtvtv/JTVTV.app"
          ls -la "$PWD/build/app-jtvtv/JTVTV.app"

      - name: Assemble IPA
        run: |
          set -euo pipefail
          NAME="${{ steps.names.outputs.name }}"
          rm -rf Payload
          mkdir Payload
          cp -R "$PWD/build/app-jtvtv/JTVTV.app" Payload/
          zip -qry "${NAME}.ipa" Payload
          ls -lh "${NAME}.ipa"
          shasum -a 256 "${NAME}.ipa"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.names.outputs.name }}
          path: ${{ steps.names.outputs.name }}.ipa
          if-no-files-found: error
